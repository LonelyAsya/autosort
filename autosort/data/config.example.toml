# Настройки autosort. Папки «откуда» и «куда» удобнее выбрать в окне программы.
# Относительные пути считаются от папки, где лежит этот файл.

[paths]
# Папка OneDrive, куда телефон складывает файлы (внутри — папки по месяцам).
source = "C:/Users/USER/OneDrive/Изображения/Camera Roll"
# Куда раскладывать. Лучше внутри того же OneDrive: тогда файлы переносятся,
# а не копируются, и лишнее место не нужно.
target = "C:/Users/USER/OneDrive/Медиатека"
# База с тегами, журналом переносов и отпечатками для поиска дублей.
database = "autosort.db"
# Кэш миниатюр (нужен окну с дублями, чтобы не скачивать файлы повторно).
cache = ".cache"

[folders]
camera = "Камера"
art = "Арты"
meme = "Мемы"
screenshot = "Скриншоты"
review = "На ручной разбор"

[layout]
# true: Камера/2024-05/IMG_....jpg; false: всё в одну папку типа.
by_month = true

[classify]
# Размеры экрана телефона (ШxВ). Картинка ровно такого размера без данных камеры
# считается скриншотом. Повёрнутый вариант учитывается автоматически.
screen_sizes = ["1080x2400", "1080x2340", "1080x2412", "1170x2532", "1179x2556", "1440x3200"]
# Если хоть один из этих тегов найден тегером, картинка считается артом.
art_hint_tags = ["1girl", "1boy", "2girls", "multiple_girls", "multiple_boys", "solo", "anime_coloring", "chibi", "furry", "monochrome", "sketch", "lineart"]
art_threshold = 0.5
# Теги «это фото»: такие картинки без данных камеры идут на ручной разбор.
photo_tags = ["realistic", "photorealistic", "photo_(medium)"]
# Теги мемов. Срабатывают только при высокой уверенности, иначе — ручной разбор.
meme_tags = ["meme"]
meme_threshold = 0.6

[tagger]
enabled = true
# Локальная модель WD14 (скачивается один раз с Hugging Face, дальше работает офлайн).
model = "SmilingWolf/wd-swinv2-tagger-v3"
device = "gpu"             # "gpu" — видеокарта (CUDA или DirectML), "cpu" — без неё
general_threshold = 0.35   # минимальная уверенность для обычных тегов
character_threshold = 0.85 # минимальная уверенность для персонажей
video_frames = 5           # сколько кадров брать из видео и GIF

[categories]
# Папка для артов, не попавших ни в одну категорию ниже.
default = "Общее"

# Категории внутри «Артов» по приоритету: арт уходит в первую подходящую,
# остальные подходящие записываются в теги. Списки тегов — обычные текстовые
# файлы, по одному тегу на строку.
[[categories.list]]
name = "Пейзажи"
tags_file = "rules/example_scenery.txt"

[authors]
# Шаблоны имён файлов, из которых можно достать автора (группа author)
# или источник (группа id).
patterns = [
    { name = "danbooru", regex = '^__.+?_drawn_by_(?P<author>.+?)__[0-9a-f]{32}' },
    { name = "twitter", regex = '^@?(?P<author>[A-Za-z0-9_]{1,15})[-_ ](?P<id>\d{15,20})' },
    { name = "pixiv", regex = '^(?:illust_)?(?P<id>\d{6,10})_p\d+' },
]

[authors.saucenao]
# Обратный поиск через интернет. Выключен: картинки уходят на внешний сервис.
# Отправляются только арты, у которых автор не нашёлся по имени файла.
enabled = false
api_key = ""
min_similarity = 80
delay_seconds = 6   # бесплатный ключ: не больше ~6 запросов в 30 секунд

[dupes]
# Насколько могут отличаться «отпечатки» похожих картинок (0 — только одинаковые,
# 6–8 — пересжатые и чуть обрезанные копии, больше — риск ложных совпадений).
phash_distance = 6

[onedrive]
# После обработки возвращать файлы в состояние «только в облаке».
free_space = true
# Сколько гигабайт держать свободными на диске во время работы.
reserve_gb = 3
