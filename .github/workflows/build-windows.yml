name: Сборка для Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install ".[tagger,dev]" pyinstaller

      - name: Тесты
        run: pytest -q

      - name: ffmpeg (сборка LGPL)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          New-Item -ItemType Directory -Force build_ffmpeg | Out-Null
          Get-ChildItem ffmpeg_dl -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination build_ffmpeg

      - name: PyInstaller
        run: pyinstaller packaging/autosort.spec --noconfirm

      - name: Проверка запуска exe
        shell: pwsh
        run: |
          $p = Start-Process dist/Autosort/Autosort.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Get-Content "$env:LOCALAPPDATA/Autosort/autosort.log" -ErrorAction SilentlyContinue; throw "Autosort.exe закрылся сразу после запуска" }
          Stop-Process -Id $p.Id

      - name: Версия
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "dev-${{ github.run_number }}" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Установщик
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
          Compress-Archive dist/Autosort/* "dist/Autosort-portable-$env:APP_VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Autosort-${{ env.APP_VERSION }}
          path: |
            dist/Autosort-Setup-*.exe
            dist/Autosort-portable-*.zip

      - name: Релиз
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Autosort-Setup-*.exe
            dist/Autosort-portable-*.zip
