name: Сборка для Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install ".[tagger,dev]" pyinstaller

      - name: Тесты
        run: pytest -q

      - name: ffmpeg (сборка LGPL)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          New-Item -ItemType Directory -Force build_ffmpeg | Out-Null
          Get-ChildItem ffmpeg_dl -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination build_ffmpeg

      - name: PyInstaller
        run: pyinstaller packaging/autosort.spec --noconfirm

      - name: Версия
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "dev-${{ github.run_number }}" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Проверка номера версии и патчноут
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if ("$env:APP_VERSION" -notmatch '^\d+\.\d+\.\d+$') { throw "Тег должен быть vX.Y.Z, а не v$env:APP_VERSION" }
          $code = python -c "import autosort; print(autosort.__version__)"
          if ($code -ne $env:APP_VERSION) { throw "Тег v$env:APP_VERSION, а в autosort/__init__.py версия $code" }
          if (-not (Select-String -Path pyproject.toml -SimpleMatch "version = `"$env:APP_VERSION`"")) { throw "В pyproject.toml другая версия" }
          python packaging/release_notes.py $env:APP_VERSION > dist/notes.md
          if ($LASTEXITCODE) { throw "Нет раздела [$env:APP_VERSION] в CHANGELOG.md" }

      - name: Portable-архив
        shell: pwsh
        run: Compress-Archive dist/Autosort "dist/Autosort-portable-$env:APP_VERSION.zip"

      - name: Проверка запуска из распакованного архива (путь с кириллицей и пробелами)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Загрузки пользователя"
          Expand-Archive "dist/Autosort-portable-$env:APP_VERSION.zip" -DestinationPath $dir
          $exe = Join-Path $dir "Autosort/Autosort.exe"
          $log = Join-Path $env:LOCALAPPDATA "Autosort/autosort.log"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 25
          Get-Content $log -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:LOCALAPPDATA "Autosort/crash.log") -ErrorAction SilentlyContinue
          if ($p.HasExited) { throw "Autosort.exe закрылся сразу после запуска (код $($p.ExitCode))" }
          $p.Refresh()
          "Окно: '$($p.MainWindowTitle)'"
          if (-not $p.MainWindowTitle.StartsWith("Autosort")) { throw "Окно Autosort не появилось" }
          if (-not (Select-String -Path $log -Pattern "запуск Autosort" -Quiet)) { throw "В журнале нет строки запуска" }
          Stop-Process -Id $p.Id

      - name: Установщик
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Проверка установки и удаления
        shell: pwsh
        run: |
          $setup = (Get-Item dist/Autosort-Setup-*.exe).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $id = "{6C3E2B7A-4E0B-4F6E-9C55-2B9E1A7D0A11}_is1"
          $key = "HKCU:", "HKLM:" | ForEach-Object { Get-ItemProperty "$_\Software\Microsoft\Windows\CurrentVersion\Uninstall\$id" -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $key) { throw "Установщик не зарегистрировал программу в «Установленных приложениях»" }
          $dir = $key.InstallLocation.TrimEnd("\")
          "Установлено в: $dir"
          if (-not (Test-Path "$dir\Autosort.exe")) { throw "Нет Autosort.exe" }
          $menus = [Environment]::GetFolderPath("Programs"), [Environment]::GetFolderPath("CommonPrograms")
          if (-not ($menus | Where-Object { Test-Path "$_\Autosort\Удалить Autosort.lnk" })) { throw "Нет ярлыка «Удалить Autosort» в Пуске" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\Autosort.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\Autosort.exe") { throw "Программа не удалилась" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Autosort")) { throw "Тихое удаление стёрло данные пользователя" }
          "Удаление работает, данные пользователя на месте"

      - uses: actions/upload-artifact@v4
        with:
          name: Autosort-${{ env.APP_VERSION }}
          path: |
            dist/Autosort-Setup-*.exe
            dist/Autosort-portable-*.zip

      - name: Релиз
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Autosort ${{ env.APP_VERSION }}
          body_path: dist/notes.md
          files: |
            dist/Autosort-Setup-*.exe
            dist/Autosort-portable-*.zip
