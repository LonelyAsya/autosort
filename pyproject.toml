[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosort"
version = "1.5.1"
description = "Локальная автосортировка медиатеки: камера / арты / мемы / скриншоты, теги, поиск дублей"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    "ImageHash>=4.3",
    "numpy>=1.24",
    "Send2Trash>=1.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
tagger = [
    "onnxruntime-directml>=1.17; sys_platform == 'win32'",
    "onnxruntime-gpu>=1.17; sys_platform == 'linux'",
    "onnxruntime>=1.17; sys_platform == 'darwin'",
    "huggingface_hub>=0.20",
]
dev = ["pytest>=8"]

[project.scripts]
autosort = "autosort.cli:main"

[project.gui-scripts]
autosort-gui = "autosort.gui:main"

[tool.setuptools.packages.find]
include = ["autosort*"]

[tool.setuptools.package-data]
autosort = ["review.html", "data/*", "data/rules/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
