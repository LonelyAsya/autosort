[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosort"
version = "0.1.0"
description = "Локальная автосортировка медиатеки: камера / арты / мемы / скриншоты, теги, поиск дублей"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    "ImageHash>=4.3",
    "numpy>=1.24",
    "Send2Trash>=1.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
tagger = [
    "onnxruntime-gpu>=1.17; sys_platform != 'darwin'",
    "onnxruntime>=1.17; sys_platform == 'darwin'",
    "huggingface_hub>=0.20",
]
dev = ["pytest>=8"]

[project.scripts]
autosort = "autosort.cli:main"

[tool.setuptools.packages.find]
include = ["autosort*"]

[tool.setuptools.package-data]
autosort = ["review.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
